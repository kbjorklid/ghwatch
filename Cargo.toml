[package]
name = "ghnotify-gemini"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
comrak = "0.52.0"
crossterm = "0.29.0"
derive_more = { version = "2.1.1", features = ["full"] }
directories = "6.0.0"
fs2 = "0.4.3"
mockall = "0.14.0"
notify = "8.2.0"
notify-rust = "4.17.0"
ratatui = { version = "0.30.0", features = ["crossterm"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.2"
